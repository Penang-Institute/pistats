project:
  type: website
  # Regenerates the Datasets page from the dashboards' own "Download data"
  # callouts before every render, so it can never drift out of sync with them.
  pre-render: scripts/build_datasets_index.py
  preview: 
    port: 8080
    watch-inputs: true

metadata-files:
  - _website.yml

format:
  html:
    theme:
    - simplex
    - assets/custom.scss
    css: assets/styles.css
    # Client-specified font (Aug 2026). Loaded via <link> rather than an SCSS
    # @import so it is guaranteed to precede the stylesheet rules.
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap">
        <script>
        // Put the Penang Institute logo inside the red title banner.
        //
        // The client asked for it to move out of the navbar and into the
        // banner (Sep 2026). Quarto builds the banner itself, so there is no
        // markup hook in the .qmd to hang it on; this injects one on load.
        //
        // It is a link to this site's homepage on purpose. Removing the navbar
        // wordmark removed the only nav route back here, and "Homepage" in the
        // navbar points at penanginstitute.org, which is a different site.
        document.addEventListener('DOMContentLoaded', function () {
          var title = document.querySelector('.quarto-title-banner .quarto-title');
          if (!title || title.querySelector('.pi-banner-logo')) return;

          // Quarto emits the heading and the description as siblings. Wrap them
          // so the banner becomes exactly two flex children, logo then text,
          // which is what lets the text sit to the right of the logo and the
          // logo scale to the height of the text beside it.
          var text = document.createElement('div');
          text.className = 'pi-banner-text';
          while (title.firstChild) text.appendChild(title.firstChild);

          var a = document.createElement('a');
          a.className = 'pi-banner-logo';
          a.href = '/';
          a.setAttribute('aria-label', 'Key Penang Statistics home');
          var img = document.createElement('img');
          img.src = '/img/cropped-penang-institute-logo.webp';
          img.alt = 'Penang Institute';
          a.appendChild(img);

          title.appendChild(a);
          title.appendChild(text);
        });
        </script>
        <script>
        // The "Dataset" link on each "Penang at a glance" card points at
        // <dashboard>.html#download-data. That callout ships collapsed, so a bare
        // anchor would land on a hidden element and the visitor would see nothing.
        // Expand it by clicking the header rather than toggling classes directly,
        // so Bootstrap's own collapse state stays consistent.
        document.addEventListener('DOMContentLoaded', function () {
          if (location.hash !== '#download-data') return;
          var el = document.getElementById('download-data');
          if (!el) return;
          var header = el.querySelector('[data-bs-toggle="collapse"]');
          if (header && header.classList.contains('collapsed')) header.click();

          // The Tableau embed above this callout renders asynchronously and grows
          // the page by thousands of pixels, so a single scroll lands nowhere near
          // the target. Re-assert the position until the layout settles, give up
          // after 4s, and bail out the moment the reader scrolls for themselves.
          var timer = setInterval(function () { el.scrollIntoView({ block: 'start' }); }, 250);
          var stop = function () { clearInterval(timer); };
          setTimeout(stop, 4000);
          ['wheel', 'touchstart', 'keydown'].forEach(function (evt) {
            window.addEventListener(evt, stop, { once: true, passive: true });
          });
        });
        </script>
    page-layout: full
    # link-external-icon: true
    anchor-sections: false
    # toc: true
    html-math-method: plain

editor: visual

resources:
# Referenced only from JS (the banner logo), so Quarto cannot discover it by
# scanning the source and would otherwise leave it out of _site.
- "img/cropped-penang-institute-logo.webp"
- "assets/dashboard_dates.json"
- "keyPenangMetrics/output/*.yaml"
- "keyPenangMetrics/output/*.json"