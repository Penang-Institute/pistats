on:
  push:
    branches: main

name: Render and Publish

# you need these permissions to publish to GitHub pages
permissions: 
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
        
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # datasets.qmd pulls in _datasets_generated.md with an include shortcode.
      # Quarto resolves includes while building the project context, which
      # happens BEFORE the pre-render step declared in _quarto.yml runs. On a
      # clean checkout that file does not exist yet (it is gitignored build
      # output), so the render dies with "Include directive failed". Generating
      # it here, before Quarto starts, is what makes a from-scratch build work.
      # The pre-render entry stays as well, so local re-renders keep it fresh.
      - name: Generate the Datasets index
        run: python3 scripts/build_datasets_index.py

      # Tableau Public view counts for the "Penang at a glance" cards.
      # This lived only in update-submodules.yml, so a publish triggered by a
      # push to main (rather than by the weekly cron) rendered the cards with
      # no counts and left view_counts.json 404 on the live site. Both publish
      # paths now fetch it.
      #
      # continue-on-error: Tableau's profile API is undocumented. If it changes
      # shape, the cards lose their counts but the site still publishes.
      - name: Fetch Tableau view counts
        continue-on-error: true
        run: python3 scripts/fetch_view_counts.py

      # NOTE: If Publishing to GitHub Pages, set the permissions correctly (see top of this yaml)
      - name: Publish to GitHub Pages (and render) 
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions
      
