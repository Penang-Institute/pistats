name: Update submodules and publish

# Replaces the keyPenangMetrics -> pistats cross-repo push (update-parent.yaml),
# which depended on a PAT (PRIVATE_TOKEN_GITHUB) that expired in June 2026.
# Running inside pistats lets the ephemeral GITHUB_TOKEN push to this repo,
# so no stored credential is needed.

on:
  schedule:
    # keyPenangMetrics renders Thursdays 05:00 UTC; run well after it finishes
    - cron: '00 12 * * THU'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules to latest remote
        run: git submodule update --remote --recursive

      - name: Commit submodule bump
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions - update submodules"
          git add --all
          git commit -m "Update submodules" || echo "No changes to commit"

      - name: Push changes
        run: git push

      # Tableau Public view counts for the "Penang at a glance" cards.
      #
      # This has to run here rather than in keyPenangMetrics: the script maps
      # workbooks to pages by scanning pistats' dashboards/ tree, which the
      # metrics repo does not have. It runs AFTER the commit/push steps on
      # purpose, so the generated file stays ephemeral build output and never
      # lands in git; `resources:` in _quarto.yml publishes it to gh-pages.
      #
      # continue-on-error: Tableau's profile API is undocumented. If it changes
      # shape, the cards lose their counts but the site still publishes. Letting
      # a third-party enrichment fail the job is what took the homepage down for
      # three weeks in Jul 2026 (the Penang Monthly RSS 403).
      - name: Fetch Tableau view counts
        continue-on-error: true
        run: python3 scripts/fetch_view_counts.py

      # A push made with GITHUB_TOKEN does not trigger the Render and Publish
      # workflow, so render and publish here in the same job.
      # datasets.qmd pulls in _datasets_generated.md with an include shortcode.
      # Quarto resolves includes while building the project context, which
      # happens BEFORE the pre-render step declared in _quarto.yml runs. On a
      # clean checkout that file does not exist yet (it is gitignored build
      # output), so the render dies with "Include directive failed". Generating
      # it here, before Quarto starts, is what makes a from-scratch build work.
      # The pre-render entry stays as well, so local re-renders keep it fresh.
      - name: Generate the Datasets index
        run: python3 scripts/build_datasets_index.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
